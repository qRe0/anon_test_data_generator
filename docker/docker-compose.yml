services:
  postgres:
    image: postgres:16-alpine
    container_name: atdg_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: staging_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d staging_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  presidio:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: atdg_presidio
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
